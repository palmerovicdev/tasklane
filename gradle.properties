# --- Identidad del plugin ---------------------------------------------------
pluginGroup = com.tasklane
pluginId = com.tasklane
pluginName = Tasklane
# Una fase cerrada = una version media: la fase N dejaba el plugin en 0.N.0. Cerrada
# la 7 estan las ocho, y por eso la 1.0.0 no fue 0.8.0. Ver docs/architecture.html §13.
#
# A partir de ahi manda semver sobre lo que ya esta publicado: patch para
# correcciones, minor para funcionalidad nueva compatible, major para un cambio que
# rompa el formato de fichero. Subir el minimo de plataforma es MENOR (ver la 2.5.0).
#
# La 2.0.0 fue mayor por lo primero: la Fase 3 del plan de escala movio las tareas de
# un tasks.xml por repositorio a un tasklane.db por proyecto. La migracion es
# automatica y el XML se conserva como tasks.xml.migrated —quitarle el sufijo es la
# vuelta atras—, pero una version anterior abierta sobre un proyecto ya migrado ve el
# repositorio vacio. Eso es romper el formato, y se numera como tal.
#
# La 2.1.0 es MENOR, y la pregunta se hizo: la Fase 4 fragmenta el directorio de
# adjuntos (attachments/ab/cd/<sha>.png), asi que una 2.0.0 abierta sobre un proyecto
# ya trasladado pinta «Image not found» en las capturas movidas. Se numera como menor
# porque lo que decide el numero es el DATO: las tareas se siguen leyendo y escribiendo
# igual —el esquema NO sube de version, ver el KDoc de TaskSchema.VERSION— y ni un byte
# de imagen se pierde: los ficheros estan ahi, en subdirectorios. Lo que se rompe es
# donde los busca una version anterior, y eso se dice en el CHANGELOG.
#
# Que el esquema no suba de version es parte de esta decision y no un detalle: subirlo
# habria dejado en SOLO LECTURA cualquier proyecto abierto luego con la 2.0.0, o sea
# habria bloqueado editar tareas para proteger dos tablas que la reconciliacion sabe
# reconstruir. Eso si habria sido un cambio mayor.
#
# La 2.2.0 es MENOR sin discusion: la Fase 5 no toca el formato. El esquema sigue en la
# version 1 y no gana ni una tabla; lo nuevo son ficheros al lado de la base
# (tasklane.db.backup) y filas en la tabla chore que ya existia. Una 2.1.0 abierta sobre
# un proyecto que ya uso la 2.2.0 lo lee y lo escribe igual.
#
# La 2.3.0 es MENOR: una iteracion pedida = una version media, y ninguna de sus piezas
# toca el formato. Los grupos por dia, las prioridades de mayor a menor en los ajustes y
# el CSV son vista y salida; vaciar un repositorio borra filas por el camino que ya usaba
# «Exportar y quitar». El esquema sigue en la version 1.
#
# Tampoco lo toca retirar el tope de escalado de las imagenes: siguen en
# attachments/ab/cd/<sha>.png —un fichero soltado conserva su formato bajo ese nombre, y
# quien lo lee lo reconoce por el contenido— y el atributo imageMaxSize de un
# tasklane.xml anterior se ignora al leerlo; una 2.2.0 que lea uno nuevo usa su valor
# por defecto.
#
# La 2.4.0 es MENOR y cierra la Fase 6 del plan de escala (endurecimiento). Tampoco toca
# el formato, y la pregunta se hizo dos veces:
#
# - SQLite pasa de ser el de la plataforma (org.jetbrains.sqlite, API interna que el
#   Marketplace rechaza) a ir empaquetado (org.xerial:sqlite-jdbc). Es el mismo motor
#   sobre el MISMO fichero: mismo tasklane.db, mismo esquema, user_version 1. Una 2.3.0
#   abre un proyecto usado por la 2.4.0 y al reves, sin migrar nada.
# - La recuperacion de una base danada deja ficheros AL LADO de la base
#   (tasklane.db.corrupt-<fecha>, tasklane.db.damaged) y filas en la tabla chore que ya
#   existia. Una version anterior los ignora.
#
# La 2.5.0 es MENOR aunque sube el minimo de plataforma, de 2025.2 a 2026.1.5
# (sinceBuild 261.27258.48). Hasta aqui la regla decia que eso era mayor, y se corrigio:
# quien siga en un IDE anterior no pierde nada, se queda en la 2.4.0 que el Marketplace
# le sigue ofreciendo, y el formato no cambia —el esquema sigue en la version 1 y la
# 2.4.0 abre lo que escribe la 2.5.0—. Lo que trae es quitar las tres APIs deprecadas que
# el Plugin Verifier del Marketplace marcaba en la 2.4.0.
#
# La 2.6.1 es MENOR: una iteracion pedida = una version media. Trae la ventana de imagen
# FIJABLE sobre el editor, el contador de capturas de la fila convertido en boton con
# vista previa al pasar el raton, la correccion de la imagen que a veces no se pintaba
# en la tarjeta desplegada, y el margen del boton de la cabecera del popup —sin el, la
# chincheta quedaba pegada a la esquina redondeada de la ventana—. Nada de eso toca el
# dato: el esquema sigue en la version 1 y la 2.5.2 abre lo que escribe la 2.6.1.
#
# La 2.6.2 es PARCHE: solo correcciones. Copiar dejo de anunciar copias que el
# portapapeles no habia aceptado, y «Exportar y quitar» dejo de borrar detras de una
# copia sin comprobar.
#
# La 2.6.3 es PARCHE por lo mismo: corrige el desplazamiento y el dibujado de la lista
# —el salto al cargar mas tareas, las tarjetas medidas contra el ancho anterior, el
# final de la lista inalcanzable y los grupos que se plegaban solos al paginar—. Nada
# de esto toca el dato: el esquema sigue en la version 1 y la 2.6.2 abre lo que escribe
# la 2.6.3.
#
# La 2.8.0 es MENOR: funcionalidad nueva compatible. Un ancla se puede ESCRIBIR en el
# dialogo —plans/deploy.md:28, con autocompletado— ademas de capturarse desde el
# editor; los TODO del codigo pasan a tareas (Alt+Enter o importandolos todos); y el
# cuerpo pinta bloques de codigo entre vallas. Todo sale en el formato de siempre
# —CodeAnchor con su texto de linea, cuerpo Markdown—, asi que el esquema sigue en la
# version 1 y la 2.6.3 abre lo que escribe la 2.8.0.
#
# La 2.15.0 es MENOR aunque anade una columna, anchor.span, y es la primera vez que la
# pregunta roza la regla: es dato del usuario (cuantas lineas abarca un ancla) y una
# version anterior que guarde esa tarea lo pierde, porque inserta sus anclas sin la
# columna. Lo que queda es el ancla de una linea de siempre, en la primera del bloque. El
# esquema NO sube de version por la misma razon de la 2.1.0: subirlo dejaria todo el
# proyecto en solo lectura para esa version, y lo que decide es que las tareas se sigan
# editando. Ver el KDoc de TaskSchema.VERSION.
#
# La 2.16.0 es MENOR y sin cambio de formato: deshacer y rehacer todo en la lista, no solo
# el borrado. La pila vive en memoria, nada se guarda en la base, y el esquema sigue en la
# version 1.
#
# La 2.17.0 es MENOR y sin cambio de formato: el tablero en una pestana del editor. No
# guarda nada propio -agrupar y ordenar una columna es configurar el estado- y el esquema
# sigue en la version 1.
#
# La 2.17.1 cierra la 2.17.0 (lo pidio asi el usuario): que estados salen en la tool window,
# en el tablero y en la barra de estado, como casillas de la tabla de estados. Va a
# workspace.xml, no a tasklane.xml; el formato no cambia.
#
# La 2.18.0 es MENOR y sin cambio de formato: las capturas, tambien para el agente (P24).
# Las herramientas MCP dan la ruta del fichero de cada imagen y aceptan imagenes por ruta,
# que se guardan como las que se sueltan en el dialogo. El esquema sigue en la version 1.
#
# La 2.19.0 es MENOR y sin cambio de formato: pegar y soltar en la lista (P27). Lo pegado o
# soltado se crea con los comandos de siempre -CreateMany, imagenes como las del dialogo- y el
# esquema sigue en la version 1.
#
# La 2.20.0 es MENOR y sin cambio de formato: la busqueda ensena por que casa (P28). La
# tarjeta elige y resalta de otra manera lo que ya tenia; que tareas salen y en que orden no
# cambia, y el esquema sigue en la version 1.
#
# La 2.21.0 es MENOR y sin cambio de formato: el lenguaje de consulta, completo (P29). Todo
# se resuelve sobre las columnas que ya habia -has:checklist se remata en Kotlin, no es una
# columna nueva- y el esquema sigue en la version 1.
#
# La 2.22.0 es MENOR y sin cambio de formato: encargar una tarea a un agente (P26). La orden y
# la peticion son de la aplicacion (tasklane-agent.xml), no del proyecto, y la terminal es
# dependencia opcional. El esquema sigue en la version 1.
#
# La 2.23.0 es MENOR y sin cambio en la base: etiquetas de verdad (P30). Renombrar, fusionar
# y borrar son el comando Retag tarea a tarea sobre las filas de siempre, y el esquema sigue
# en la version 1. tasklane.xml gana una lista <tags> solo si alguna etiqueta tiene color, y
# una version anterior la ignora.
#
# La 2.24.0 es MENOR y sin cambio de formato: vencimiento y etiquetas desde el menu y sobre
# una seleccion (P31). Sumar y quitar etiquetas son dos comandos nuevos, AddTags y RemoveTags,
# sobre las filas de siempre; el esquema sigue en la version 1.
#
# La 2.25.0 es MENOR y sin cambio de formato: el teclado, entero (P34). Solo acciones y
# atajos; ni la base ni tasklane.xml cambian.
#
# La 2.25.1 cierra la 2.25.0 (lo pidio asi el usuario): Hand Off to Agent ya no pasa la tarea
# a Doing; la cierra el agente con tasklane_complete_task. Sin cambio de formato.
#
# La 2.26.0 es MENOR y sin cambio de formato: los primeros pasos en la lista vacia y los
# Got It de la primera ancla y la primera captura (P35). Que ya se vieron lo guarda la
# plataforma, a nivel de aplicacion; ni la base ni tasklane.xml cambian.
#
# Al subirla hay que tocar tambien changeNotes (build.gradle.kts) y CHANGELOG.md.
pluginVersion = 2.26.0

# Decision de docs/architecture.html §14, revisada el 2026-09-15: el suelo pasa de
# 252 (2025.2) a la build 261.27258.48, que es IntelliJ IDEA 2026.1.5. Se fija la build
# entera y no solo 261: 2026.1.0-2026.1.4 quedan fuera a proposito.
# Sin untilBuild -> el plugin no caduca al salir una version nueva del IDE.
pluginSinceBuild = 261.27258.48

# --- Plataforma de compilacion ----------------------------------------------
# localIdePath: si apunta a un IDE instalado, se compila contra el SIN DESCARGAR
# NADA. Dejalo vacio (o pasa -PlocalIdePath= en CI) para descargar platformVersion.
#
# AVISO: compilando contra un IDE 2026.2 el compilador NO puede garantizar el
# suelo sinceBuild=261.27258.48. Antes de publicar hay que construir una vez con
# localIdePath vacio, o pasar el Plugin Verifier.
localIdePath = /Applications/IntelliJ IDEA.app

# IU y no IC: desde la 2025.3 IntelliJ IDEA es una sola distribucion y ya no hay
# Community de la 2026.1. platformVersion es la version de sinceBuild.
platformType = IU
platformVersion = 2026.1.5

# --- Toolchain --------------------------------------------------------------
# El JBR de la IDEA instalada trae javac, asi que sirve de toolchain y evita
# descargar un JDK 21 aparte.
org.gradle.java.installations.paths = /Applications/IntelliJ IDEA.app/Contents/jbr/Contents/Home

gradleVersion = 9.5.0

# --- Gradle -----------------------------------------------------------------
# La plataforma ya trae kotlin-stdlib; empaquetar la nuestra causa conflictos
# de classloader (mismo motivo por el que descartamos kotlinx-serialization).
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.jvmargs = -Xmx2g -XX:MaxMetaspaceSize=768m

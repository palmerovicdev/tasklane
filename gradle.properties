# --- Identidad del plugin ---------------------------------------------------
pluginGroup = com.tasklane
pluginId = com.tasklane
pluginName = Tasklane
# Una fase cerrada = una version media: la fase N dejaba el plugin en 0.N.0. Cerrada
# la 7 estan las ocho, y por eso la 1.0.0 no fue 0.8.0. Ver docs/architecture.html §13.
#
# A partir de ahi manda semver sobre lo que ya esta publicado: patch para
# correcciones, minor para funcionalidad nueva compatible, major para un cambio que
# rompa el formato de fichero o el minimo de plataforma.
#
# La 2.0.0 es mayor por lo primero: la Fase 3 del plan de escala mueve las tareas de
# un tasks.xml por repositorio a un tasklane.db por proyecto. La migracion es
# automatica y el XML se conserva como tasks.xml.migrated —quitarle el sufijo es la
# vuelta atras—, pero una version anterior abierta sobre un proyecto ya migrado ve el
# repositorio vacio. Eso es romper el formato, y se numera como tal.
#
# Al subirla hay que tocar tambien changeNotes (build.gradle.kts) y CHANGELOG.md.
pluginVersion = 2.0.0

# Decision cerrada en docs/architecture.html §14: sinceBuild = 252 (2025.2).
# Sin untilBuild -> el plugin no caduca al salir una version nueva del IDE.
pluginSinceBuild = 252

# --- Plataforma de compilacion ----------------------------------------------
# localIdePath: si apunta a un IDE instalado, se compila contra el SIN DESCARGAR
# NADA. Dejalo vacio (o pasa -PlocalIdePath= en CI) para descargar platformVersion.
#
# AVISO: compilando contra un IDE 2026.2 el compilador NO puede garantizar el
# suelo sinceBuild=252. Antes de publicar hay que construir una vez con
# localIdePath vacio, o pasar el Plugin Verifier.
localIdePath = /Applications/IntelliJ IDEA.app

platformType = IC
platformVersion = 2025.2.6.2

# --- Toolchain --------------------------------------------------------------
# El JBR de la IDEA instalada trae javac, asi que sirve de toolchain y evita
# descargar un JDK 21 aparte.
org.gradle.java.installations.paths = /Applications/IntelliJ IDEA.app/Contents/jbr/Contents/Home

gradleVersion = 9.5.0

# --- Gradle -----------------------------------------------------------------
# La plataforma ya trae kotlin-stdlib; empaquetar la nuestra causa conflictos
# de classloader (mismo motivo por el que descartamos kotlinx-serialization).
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.jvmargs = -Xmx2g -XX:MaxMetaspaceSize=768m

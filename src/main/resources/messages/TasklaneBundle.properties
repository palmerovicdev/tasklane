settings.anchors.marker.gutter=With an icon in the gutter
settings.anchors.marker.inline=Inline, at the anchored character
settings.anchors.marker.off=Do not mark them
settings.anchors.comment=Only tasks in a non-terminal state are marked: a task that is \
  done is history, not a note about the code. The inline mark is the only one that shows \
  which part of the line the task was about, at the cost of shifting the code to the \
  right. This one is yours alone: it is not shared with the project.

